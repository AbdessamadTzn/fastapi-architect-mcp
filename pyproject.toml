[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-architect-mcp"
version = "0.2.0"
description = "MCP server giving Claude Code IDE-level intelligence for FastAPI projects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mcp", "fastapi", "claude", "llm", "developer-tools"]
authors = [
    { name = "Abdessamad Touzani"}
]
dependencies = [
    "mcp>=1.0.0",
    "jedi>=0.19.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AbdessamadTzn/fastapi-architect-mcp"
Repository = "https://github.com/AbdessamadTzn/fastapi-architect-mcp"

[project.scripts]
fastapi-architect-mcp = "fastapi_architect.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
